services:
  - type: web
    name: onboardflow-java-api
    runtime: docker
    plan: free
    dockerfilePath: ./java-backend/Dockerfile
    dockerContext: ./java-backend
    healthCheckPath: /api/health
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SCHEMA
        value: onboardflow
      - key: APP_NAME
        value: onboardflow-api
      - key: N8N_WEBHOOK_URL
        sync: false
      - key: N8N_LEAD_WEBHOOK_URL
        sync: false
      - key: N8N_WEBHOOK_SECRET
        sync: false

  - type: web
    name: onboardflow-python-service
    runtime: docker
    plan: free
    dockerfilePath: ./python-automation/Dockerfile
    dockerContext: ./python-automation
    healthCheckPath: /health

  - type: web
    name: onboardflow-frontend
    runtime: static
    buildCommand: echo "Static frontend ready"
    staticPublishPath: ./frontend
